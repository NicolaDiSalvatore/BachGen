services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    volumes:
          - ./mlruns:/app/mlruns
          - ./mlflow_db:/app/mlflow_db
    environment:
      - MLFLOW_TRACKING_URI=file:///app/mlruns
      - MLFLOW_REGISTRY_URI=sqlite:///app/mlflow_db/mlflow.db

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
      --host 0.0.0.0
